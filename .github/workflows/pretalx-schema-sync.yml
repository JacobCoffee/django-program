name: Pretalx Schema Sync

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 6am UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync Pretalx Schema & Regenerate Client
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.2"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Fetch, validate, and generate Pretalx client
        run: make pretalx-sync-schema

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: regenerate pretalx client from upstream schema"
          branch: chore/pretalx-schema-sync
          delete-branch: true
          title: "chore: update pretalx API client from schema"
          body: |
            ## Automated Pretalx Schema Sync

            This PR was automatically generated by the [Pretalx Schema Sync](${{ github.server_url }}/${{ github.repository }}/actions/workflows/pretalx-schema-sync.yml) workflow.

            **What changed:**
            - Fetched the latest OpenAPI schema from https://docs.pretalx.org/schema.yml
            - Validated the schema
            - Regenerated the Python client models in `packages/pretalx-client/src/pretalx_client/generated/`

            Please review the generated code for any breaking changes before merging.
          labels: |
            automated
            dependencies
          assignees: JacobCoffee
