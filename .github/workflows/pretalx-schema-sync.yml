name: Pretalx Schema Sync

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 6am UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync Pretalx Schema & Regenerate Client
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.2"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Fetch, validate, and generate Pretalx client
        run: make pretalx-sync-schema

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: regenerate pretalx client from upstream schema"
          branch: chore/pretalx-schema-sync
          delete-branch: true
          title: "chore: update pretalx API client from schema"
          body: |
            ## Automated Pretalx Schema Sync

            This PR was automatically generated by the [Pretalx Schema Sync](${{ github.server_url }}/${{ github.repository }}/actions/workflows/pretalx-schema-sync.yml) workflow.

            **What changed:**
            - Fetched the latest OpenAPI schema from https://docs.pretalx.org/schema.yml
            - Validated the schema
            - Regenerated the Python client models in `packages/pretalx-client/src/pretalx_client/generated/`

            Please review the generated code for any breaking changes before merging.
          labels: |
            automated
            dependencies
          assignees: JacobCoffee
