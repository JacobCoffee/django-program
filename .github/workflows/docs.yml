name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "packages/pretalx-client/docs/**"
      - "packages/pretalx-client/src/**"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "packages/pretalx-client/docs/**"
      - "packages/pretalx-client/src/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.2"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --group docs

      - name: Build pretalx-client docs (first, for intersphinx)
        run: >-
          uv run sphinx-build -M html
          packages/pretalx-client/docs packages/pretalx-client/docs/_build/
          -E -a -j auto --keep-going

      - name: Build django-program docs
        run: >-
          uv run sphinx-build -M html
          docs docs/_build/
          -E -a -j auto --keep-going

      - name: Merge doc sites
        run: |
          mkdir -p docs/_build/html/pretalx-client
          cp -r packages/pretalx-client/docs/_build/html/* docs/_build/html/pretalx-client/

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html

  deploy:
    name: Deploy
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
